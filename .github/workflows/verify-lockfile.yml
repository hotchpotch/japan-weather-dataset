# Fails when .github/workflows/actions.lock is out of sync with the
# workflows or a locked commit no longer verifies upstream. Regenerate the
# lockfile with `gh actions-lock` after changing an action (docs/release.md).
name: Verify actions lockfile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0
      - name: Verify
        run: gh actions-lock --verify
