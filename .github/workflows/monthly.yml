# Monthly update of the Hugging Face dataset (docs/operations.md, "Monthly
# update"): runs scripts/jwd-monthly.sh in the released image JWD_IMAGE.
# The month before last and the last month are fetched again after they
# ended, the oldest month file goes into its year file, the station list is
# refreshed. About 260 requests; no crawl state.
#
# Needs the repository variable HF_DATASET_REPO and the secret HF_TOKEN
# (write access to that dataset), like daily.yml; optionally the secret
# HEALTHCHECKS_MONTHLY_URL for monitoring (docs/operations.md,
# "Monitoring").
name: monthly

on:
  schedule:
    - cron: "0 11 1 * *" # the 1st, 20:00 JST: the last month has just ended, far from the daily run (05:17)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "print the plan only: no requests to JMA, no upload"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  actions: write # disable the scheduled updates after a block (exit code 4)

# The same group as daily.yml: both rewrite manifest.json and the month
# files, so they run one after the other.
concurrency:
  group: hf-dataset
  cancel-in-progress: false

env:
  # A released tag (release.yml); change it to use a new release.
  JWD_IMAGE: ghcr.io/hotchpotch/japan-weather-dataset:latest # moved by each release (release.yml)

jobs:
  monthly:
    # Forks must not send requests to JMA on a schedule.
    if: github.repository == 'hotchpotch/japan-weather-dataset'
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - name: Report the start to Healthchecks.io
        # Monitoring (docs/operations.md, "Monitoring"): skipped without
        # the secret or in a dry run; a failed ping only warns.
        if: ${{ !inputs.dry_run }}
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_MONTHLY_URL }}
        run: |
          [ -n "$HC_URL" ] || exit 0
          curl -fsS -m 10 --retry 5 --retry-all-errors -o /dev/null "$HC_URL/start" ||
            echo "::warning::Healthchecks.io did not receive the start"

      - name: Pull the image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$JWD_IMAGE"

      - name: Monthly update
        id: update
        env:
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '-dry-run' || '' }}
        # The job summary (requests, access limits, month files, the
        # commit) is written to the mounted GITHUB_STEP_SUMMARY.
        run: |
          mkdir -p "$RUNNER_TEMP/dataset"
          code=0
          # shellcheck disable=SC2086 # DRY_RUN is empty or one flag
          docker run --rm --init --user "$(id -u):$(id -g)" \
            -e HF_DATASET_REPO -e HF_TOKEN \
            -e GITHUB_STEP_SUMMARY=/summary.md -v "$GITHUB_STEP_SUMMARY:/summary.md" \
            -v "$RUNNER_TEMP/dataset:/dataset" "$JWD_IMAGE" \
            jwd-monthly.sh $DRY_RUN || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Stop the scheduled updates after a block
        # As in daily.yml: JMA refused access (exit code 4).
        if: failure() && steps.update.outputs.code == '4'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow disable daily.yml
          gh workflow disable monthly.yml
          echo "::error::JMA blocked the access; daily.yml and monthly.yml are disabled. Check the service, then enable them with gh workflow enable."
          echo "**JMA blocked the access: daily.yml and monthly.yml are disabled.**" >> "$GITHUB_STEP_SUMMARY"

      - name: Report the result to Healthchecks.io
        # Success (0) or the exit code of the update (fail when the job
        # failed elsewhere); a dry run is only logged (no status change).
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_MONTHLY_URL }}
          JOB_STATUS: ${{ job.status }}
          CODE: ${{ steps.update.outputs.code }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$HC_URL" ] || exit 0
          if [ "$DRY_RUN" = true ]; then path=log
          elif [ "$JOB_STATUS" = success ]; then path=0
          elif [ -n "$CODE" ] && [ "$CODE" != 0 ]; then path=$CODE
          else path=fail
          fi
          curl -fsS -m 10 --retry 5 --retry-all-errors -o /dev/null \
            --data-raw "$JOB_STATUS, exit code ${CODE:-none}: $RUN_URL" "$HC_URL/$path" ||
            echo "::warning::Healthchecks.io did not receive the result"
