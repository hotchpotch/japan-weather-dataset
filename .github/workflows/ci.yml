# Tests, script checks and the image build on every push to main and pull
# request. No requests to JMA and no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...

  scripts:
    name: Scripts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: bash -n
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: |
          if command -v shellcheck >/dev/null; then shellcheck scripts/*.sh
          else echo "shellcheck is not installed on this runner; skipped"; fi

  image:
    name: Image build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg VERSION=ci --build-arg "REVISION=$GITHUB_SHA" -t jwd:ci .
      - name: Smoke test
        run: |
          test "$(docker run --rm jwd:ci jwd version)" = ci
          docker run --rm jwd:ci hf version
          docker run --rm jwd:ci bash -n /opt/jwd/scripts/jwd-daily.sh
          docker run --rm jwd:ci bash -n /opt/jwd/scripts/jwd-monthly.sh
