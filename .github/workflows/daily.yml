# Daily update of the current month files of the Hugging Face dataset
# (docs/operations.md, "Daily update of the current month"): runs
# scripts/jwd-daily.sh in the released image JWD_IMAGE.
#
# Needs the repository variable HF_DATASET_REPO (e.g. user/japan-weather)
# and the secret HF_TOKEN (write access to that dataset); optionally the
# secret HEALTHCHECKS_DAILY_URL for monitoring (docs/operations.md,
# "Monitoring"). The months before are rewritten by the monthly run
# (monthly.yml).
name: daily

on:
  schedule:
    - cron: "17 20 * * *" # 05:17 JST, after JMA's 01:00/03:00 updates; not on the hour
  workflow_dispatch:
    inputs:
      refetch_days:
        description: last days up to yesterday fetched again
        default: "3"
      max_gap_days:
        description: missing days before them filled at most
        default: "3"

permissions:
  contents: read
  packages: read
  actions: write # disable the scheduled updates after a block (exit code 4)

# The same group as monthly.yml: both rewrite manifest.json and the month
# files, so they run one after the other (the monthly run starts at 20:00
# JST, long after this one, so they rarely meet).
concurrency:
  group: hf-dataset
  cancel-in-progress: false

env:
  # A released tag (release.yml); change it to use a new release.
  JWD_IMAGE: ghcr.io/hotchpotch/japan-weather-dataset:latest # moved by each release (release.yml)

jobs:
  daily:
    # Forks must not send requests to JMA on a schedule.
    if: github.repository == 'hotchpotch/japan-weather-dataset'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Report the start to Healthchecks.io
        # Monitoring (docs/operations.md, "Monitoring"): skipped without
        # the secret; a failed ping only warns.
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_DAILY_URL }}
        run: |
          [ -n "$HC_URL" ] || exit 0
          curl -fsS -m 10 --retry 5 --retry-all-errors -o /dev/null "$HC_URL/start" ||
            echo "::warning::Healthchecks.io did not receive the start"

      - name: Pull the image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$JWD_IMAGE"

      - name: Update the month files
        id: update
        env:
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REFETCH_DAYS: ${{ inputs.refetch_days || '3' }}
          MAX_GAP_DAYS: ${{ inputs.max_gap_days || '3' }}
        # Exit code 7 (days missing beyond -max-gap-days) fails the job
        # after the fetched days are uploaded.
        run: |
          mkdir -p "$RUNNER_TEMP/dataset"
          code=0
          docker run --rm --init --user "$(id -u):$(id -g)" \
            -e HF_DATASET_REPO -e HF_TOKEN -e GITHUB_ACTIONS \
            -e GITHUB_STEP_SUMMARY=/summary.md -v "$GITHUB_STEP_SUMMARY:/summary.md" \
            -v "$RUNNER_TEMP/dataset:/dataset" "$JWD_IMAGE" \
            jwd-daily.sh -refetch-days "$REFETCH_DAYS" -max-gap-days "$MAX_GAP_DAYS" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Stop the scheduled updates after a block
        # JMA refused access (exit code 4): no further scheduled requests
        # until the maintainer checked the service and enabled the
        # workflows again (docs/operations.md). keepalive.yml does not
        # enable workflows that were disabled by hand or by this step.
        if: failure() && steps.update.outputs.code == '4'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow disable daily.yml
          gh workflow disable monthly.yml
          echo "::error::JMA blocked the access; daily.yml and monthly.yml are disabled. Check the service, then enable them with gh workflow enable."
          echo "**JMA blocked the access: daily.yml and monthly.yml are disabled.**" >> "$GITHUB_STEP_SUMMARY"

      - name: Report the result to Healthchecks.io
        # Success (0) or the exit code of the update (fail when the job
        # failed elsewhere): Healthchecks.io alerts at once on a failure.
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_DAILY_URL }}
          JOB_STATUS: ${{ job.status }}
          CODE: ${{ steps.update.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$HC_URL" ] || exit 0
          if [ "$JOB_STATUS" = success ]; then path=0
          elif [ -n "$CODE" ] && [ "$CODE" != 0 ]; then path=$CODE
          else path=fail
          fi
          curl -fsS -m 10 --retry 5 --retry-all-errors -o /dev/null \
            --data-raw "$JOB_STATUS, exit code ${CODE:-none}: $RUN_URL" "$HC_URL/$path" ||
            echo "::warning::Healthchecks.io did not receive the result"
