version: 2

# Actions: version updates once a month, grouped into one pull request,
# after a 7-day cooldown; Dependabot regenerates
# .github/workflows/actions.lock in the same PR. The update workflows use no
# actions, so a merge needs no release.
# Go modules: security updates only (`open-pull-requests-limit: 0` disables
# version updates; security updates have their own limit and still open pull
# requests).
# Review every PR like any change (CI must pass). Dependabot has no security
# updates for Docker base images, and the hf CLI is pinned in the Dockerfile
# and the scripts: refresh those by hand.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
